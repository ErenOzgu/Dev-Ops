name: Deploy Production (elle onaylı, üretime dağıtım)

# BİLİNÇLİ TASARIM: Bu workflow otomatik tetiklenmez. Sadece Gitea arayüzünden
# "Run Workflow" butonuyla, bir insan bilinçli olarak tetiklediğinde çalışır.
# Neden: üretime giden adım, sistemin geri kalanından farklı olarak geri
# dönüşü en pahalı olan adım — burada otomasyonun hızından çok insanın
# "evet, yedek CORE'da denedim, sorun yok, şimdi üretime al" onayı önemli.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Dağıtılacak sürüm (örn. 1.6.1) — release.yml'in ürettiği tar'daki sürümle AYNI olmalı"
        required: true
        type: string
      confirm:
        description: "Yedek CORE'da bu sürümü test ettiğinizi onaylıyor musunuz?"
        required: true
        type: choice
        options:
          - "Evet, yedek CORE'da test ettim, üretime alıyorum"

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    steps:
      - name: Onay kontrolü
        run: |
          echo "Dağıtılacak sürüm: ${{ inputs.version }}"
          echo "Onay: ${{ inputs.confirm }}"

      - name: SSH anahtarını hazırla
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.PROD_CORE_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Üretimdeki mevcut sürümü yedekle (rollback için)
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.PROD_CORE_HOST }}" \
            "sudo /opt/rnvcs/scripts/backup_current.sh"

      - name: Yedek CORE'daki tar'ı üretime kopyala (tek doğruluk kaynağı — yeniden derlemiyoruz)
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.YEDEK_CORE_HOST }}" \
            "cat /opt/rnvcs/releases/rnvcs-v${{ inputs.version }}.tar.gz" | \
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.PROD_CORE_HOST }}" \
            "cat > /opt/rnvcs/incoming/rnvcs-v${{ inputs.version }}.tar.gz"

      - name: Üretimde kurulum betiğini çalıştır
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.PROD_CORE_HOST }}" \
            "sudo /opt/rnvcs/scripts/deploy_apply.sh /opt/rnvcs/incoming/rnvcs-v${{ inputs.version }}.tar.gz"

      - name: Üretimde smoke test — BAŞARISIZSA OTOMATİK GERİ AL
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.PROD_CORE_HOST }}" \
            "/opt/rnvcs/scripts/rnvcs_smoke_test.sh -e" || {
              echo "!!! SMOKE TEST BAŞARISIZ — otomatik rollback tetikleniyor !!!"
              ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
                "${{ secrets.DEPLOY_USER }}@${{ secrets.PROD_CORE_HOST }}" \
                "sudo /opt/rnvcs/scripts/rollback.sh"
              exit 1
            }

      - name: Panel'e de dağıt (varsa panel_app.html güncellemesi)
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.YEDEK_CORE_HOST }}" \
            "cat /opt/rnvcs/releases/rnvcs-v${{ inputs.version }}/panel-app/panel_app.html" | \
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.PANEL_HOST }}" \
            "cat > /opt/rnvcs/panel_app.html.new && sudo mv /opt/rnvcs/panel_app.html.new /opt/rnvcs/panel_app.html"

      - name: Başarı özeti
        if: success()
        run: echo "Sürüm v${{ inputs.version }} ÜRETİME başarıyla dağıtıldı ve smoke test geçti."
