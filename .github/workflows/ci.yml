name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (${{ matrix.module }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        module: [core, panel-backend]
    defaults:
      run:
        working-directory: RNVCS/${{ matrix.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.23"
          cache: false # sıfır harici bağımlılık: go.sum yok
      - name: gofmt
        run: |
          test -z "$(gofmt -l .)" || { echo "gofmt gerekli:"; gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test (race)
        run: go test ./... -race -count=1

  shell:
    name: Shell betikleri (sözdizimi)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: bash -n
        run: |
          status=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "sözdizimi hatası: $f"; status=1; }
          done < <(git ls-files '*.sh')
          exit $status

  integration:
    name: Entegrasyon (PostgreSQL)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rnvcs
          POSTGRES_PASSWORD: rnvcs_test_only
          POSTGRES_DB: rnvcs_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rnvcs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.23"
          cache: false
      - name: Uçtan uca test (migration + core API)
        env:
          RNVCS_DB_DSN: postgresql://rnvcs:rnvcs_test_only@localhost:5432/rnvcs_ci_test?sslmode=disable
        run: ./RNVCS/scripts/ci_integration_test.sh

  docker:
    name: Docker (compose duman testi)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: İmajı derle, compose ile ayağa kaldır, API'yi doğrula
        run: ./RNVCS/scripts/compose_smoke_test.sh

  publish:
    name: core imajını GHCR'ye yayınla
    needs: [go, shell, integration, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/erenozgu/rnvcs-core
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: RNVCS/core
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
