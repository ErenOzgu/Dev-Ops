# One pull request a month, with everything that moved in it, so keeping the pins fresh does not mean a stream of
# notifications. Actions are pinned to commit SHAs; Dependabot updates the SHA and the version in the comment.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /RNVCS/core
    schedule:
      interval: monthly
    groups:
      images:
        patterns: ["*"]
    ignore:
      # Base images move by digest and patch release only. A new minor or major version of Go, Postgres or Python is a
      # decision (with a change to the code and its tests), not a monthly bump.
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    groups:
      images:
        patterns: ["*"]
    ignore:
      # Base images move by digest and patch release only. A new minor or major version of Go, Postgres or Python is a
      # decision (with a change to the code and its tests), not a monthly bump.
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
